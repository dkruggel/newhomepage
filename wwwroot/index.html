<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>David Kruggel</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />

    <!-- Add Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Varela+Round:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <a class="sr-only sr-only-focusable" href="#main-content"
      >Skip to content</a
    >
    <div id="app">
      <svg class="loading-progress">
        <circle r="40%" cx="50%" cy="50%" />
        <circle r="40%" cx="50%" cy="50%" />
      </svg>
      <div class="loading-progress-text"></div>
    </div>

    <!-- ARIA live region for polite announcements (screen-reader only) -->
    <div
      id="aria-live"
      class="sr-only"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <!-- Small JS helpers for localStorage and app utilities -->
    <script>
      window.appLocalStorage = {
        getItem: function (key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        },
        setItem: function (key, value) {
          try {
            localStorage.setItem(key, value);
            return true;
          } catch (e) {
            return false;
          }
        },
        removeItem: function (key) {
          try {
            localStorage.removeItem(key);
            return true;
          } catch (e) {
            return false;
          }
        },
      };
      // Simple aria-live helper
      window.setAriaLive = function (text) {
        try {
          var el = document.getElementById('aria-live');
          if (el) el.innerText = text || '';
        } catch (e) {}
      };
      // Simple aria-live helper
      window.setAriaLive = function (text) {
        try {
          var el = document.getElementById('aria-live');
          if (el) el.innerText = text || '';
        } catch (e) {}
      };

      // Clear cached weather entries (localStorage keys starting with 'weather-cache:')
      window.clearWeatherCache = function () {
        try {
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var key = localStorage.key(i);
            if (key && key.startsWith('weather-cache:')) {
              localStorage.removeItem(key);
            }
          }
          return true;
        } catch (e) {
          return false;
        }
      };

      // Dispatcher to save settings and notify Blazor (C#) immediately.
      // It writes to localStorage and then attempts to call the static JSInvokable
      // method 'OnAppSettingsChangedFromJs' on the .NET side.
      window.dispatchAppSettings = function (json) {
        try {
          localStorage.setItem('app-settings', json);
        } catch (e) {
          // ignore
        }

        // If Blazor has been initialized and DotNet exists, try invoking the JSInvokable
        try {
          if (window.DotNet && window.DotNet.invokeMethodAsync) {
            // Call the JSInvokable method defined in Shared.Services.SettingsBridge
            // Namespace: newhomepage.Shared.Services
            return window.DotNet.invokeMethodAsync(
              'newhomepage',
              'OnAppSettingsChangedFromJs',
              json
            ).catch(function (err) {
              console.warn('dispatchAppSettings: DotNet invoke failed', err);
            });
          }
        } catch (e) {
          // swallow
        }
        return Promise.resolve();
      };
    </script>

    <div id="blazor-error-ui">
      An unhandled error has occurred.
      <a href="" class="reload">Reload</a>
      <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
  </body>
</html>
